[package]
name = "factrail"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Verbatim, fact-keeping context compaction for coding agents: the Claude Code hook binary, transcript replay, evaluation and Tev-format dataset export."
readme = "README.md"
keywords = ["llm", "context", "compaction", "claude-code", "agents"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "factrail"
path = "src/main.rs"

[dependencies]
factrail-core = { workspace = true }
factrail-policy = { workspace = true }
factrail-backend = { workspace = true }
factrail-eval = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
